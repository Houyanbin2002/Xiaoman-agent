services:
  xiaoman-debug:
    build:
      context: ../..
      dockerfile: docker/debug/Dockerfile
    image: xiaoman-agent-debug:latest
    working_dir: /app
    environment:
      XIAOMAN_DEBUG_CONFIG: /sandbox/config.toml
      XIAOMAN_DEBUG_WORKSPACE: /sandbox/workspace
      XIAOMAN_DASHBOARD_HOST: 0.0.0.0
      XIAOMAN_DASHBOARD_PORT: "2236"
      XIAOMAN_HOST_GID: "${GID:-1000}"
      XIAOMAN_HOST_UID: "${UID:-1000}"
      XIAOMAN_DEBUG_PROFILE: "${XIAOMAN_DEBUG_PROFILE:-default}"
      HOME: /sandbox/home
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../..:/app
      - ./profiles/${XIAOMAN_DEBUG_PROFILE:-default}:/sandbox
    ports:
      - "127.0.0.1:2237:2236"
    stdin_open: true
    tty: true
