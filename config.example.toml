# =============================================================================
# 必填：LLM 配置
# api_key 可以直接填字符串，也可以用 ${ENV_VAR} 引用环境变量。
# =============================================================================

[llm]
provider = "openai"

[llm.main]
# 主模型，必填。当前 Xiaoman 默认使用阿里百炼 DeepSeek Pro。
model = "deepseek-v4-pro-0813"
api_key = "sk-..."
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
enable_thinking = true
multimodal = false

[llm.fast]
# 轻量模型，用于 memory gate / query rewrite / HyDE。
# 不填则退回主模型，但延迟会稍高。
model = "qwen3.7-flash"
api_key = "sk-..."
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

[llm.vl]
# 视觉模型，仅在 llm.main.multimodal = false 时需要。
# model 留空则不启用，图片会作为路径传给主模型。
model = "qwen-vl-plus"
api_key = "sk-..."
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

# =============================================================================
# Agent 行为
# =============================================================================

[agent]
system_prompt = "You are Xiaoman, a helpful AI assistant with access to tools. Always respond in the same language the user uses."
max_tokens = 8192
# 设为 0 表示不限制迭代轮数；长任务仍可用 /stop 中断。
max_iterations = 16
dev_mode = false

[agent.context]
# 仅在关闭 token 摘要时作为旧式消息窗口；开启 compaction 后不截断模型历史。
memory_window = 40

# 多轮上下文按 token 水位分代摘要。摘要成功后才推进会话游标；
# 同一摘要 epoch 内只追加近期原文，以维持 Prompt Cache 稳定前缀。
[agent.context.compaction]
enabled = true
trigger_tokens = 200000
target_tokens = 100000
keep_recent_tokens = 40000
summary_max_tokens = 4096
chunk_tokens = 24000
max_history_messages = 2000

# Prompt Cache：稳定前缀不动，只压缩断点前的冷工具轨迹。
[agent.context.cache]
enabled = true
keep_recent_tool_rounds = 3
cold_tool_result_chars = 1800
recent_tool_result_chars = 12000

# AgentLoop 防失控：状态直接持久化进 LangGraph checkpoint。
[agent.guard]
enabled = true
window_rounds = 6
same_signature_warn = 2
same_signature_stop = 3
no_progress_rounds = 4
max_tool_calls = 12
soft_timeout_seconds = 600
hard_timeout_seconds = 3900
model_call_timeout_seconds = 180
tool_timeout_seconds = 300
side_effect_tool_timeout_seconds = 300
blocking_tool_timeout_seconds = 3600
context_soft_tokens = 120000
context_hard_tokens = 160000
max_tool_result_chars = 12000
max_tool_round_chars = 24000
max_turn_tool_result_chars = 60000
subagent_max_iterations = 10
subagent_timeout_seconds = 3900
subagent_result_chars = 12000
workflow_max_concurrency = 2
workflow_step_timeout_seconds = 4200
workflow_max_subagent_steps = 4

[agent.tools]
search_enabled = true

# 可选：长期记忆整理任务（默认已启用，通常无需修改）
# [agent.maintenance]
# memory_optimizer_enabled = true
# memory_optimizer_interval_seconds = 64800

# 可选：控制加载哪些工具集（默认值适合大多数场景）
# [agent.wiring]
# toolsets = ["meta_common", "task_executor", "schedule", "mcp", "workflow"]

# =============================================================================
# 可选：配置一个远程消息入口。官方 QQ 和企业微信都通过插件接入。
# 凭据为空时插件仍可加载，但不会创建网络连接。
# =============================================================================

[channels.telegram]
# BotFather 给的 bot token，格式：123456789:AAF...
token = ""
# 你的 Telegram 用户名（不带 @），只有白名单用户才能使用 bot。
allow_from = ["your_username"]
# channel 标识符，决定 session key 前缀（如 telegram:12345）。
# 多个 bot 想要隔离记忆时，改成不同的名字（如 "telegram_work"）。
# channel_name = "telegram"

[plugins.qqbot]
# QQ 开放平台官方机器人，使用 Gateway 长连接，无需登录个人 QQ 客户端。
enabled = true
app_id = ""
client_secret = ""
# 私聊白名单使用官方 user_openid。
allow_from = []

# 可选：允许指定群使用；配置了 groups 后，未列出的群会被拒绝。
# [[plugins.qqbot.groups]]
# group_openid = "GROUP_OPENID"
# allow_from = ["MEMBER_OPENID"]
# require_at = true
# allow_proactive = false

[plugins.weixin]
# 个人微信通过腾讯 iLink Bot API 扫码登录；Token 存入系统凭据库，不写入本文件。
enabled = true
account_id = ""
# 私聊用户白名单；留空接受所有能联系该 iLink 机器人身份的用户。
allow_from = []
# iLink 机器人通常无法加入普通微信群，因此群聊默认关闭。
groups_enabled = false
group_allow_from = []

[plugins.wecom]
# 企业微信官方智能机器人。在管理后台选择 API 模式 → 使用长连接。
enabled = true
bot_id = ""
secret = ""
# 企业微信 userid 白名单；留空允许所有可见范围内成员。
allow_from = []
# 私有化部署时可覆盖长连接地址。
# websocket_url = "wss://openws.work.weixin.qq.com"

[plugins.feishu]
# 飞书自建应用（长连接模式，无需公网回调）。留空跳过。
# app_id / app_secret 来自开放平台「凭证与基础信息」。
app_id = ""
app_secret = ""
# 私聊白名单填 open_id（ou_...）/ user_id / union_id，留空允许所有人。
allow_from = []
# 私有化部署改 domain，如 https://open.larksuite.com（Lark 国际版）。
# domain = "https://open.feishu.cn"

[plugins.daynight_gate]
# 默认在北京时间凌晨降低主动 tick 过 gate 概率。
enabled = true
timezone = "Asia/Shanghai"
start = "00:00"
end = "06:00"
pass_probability = 0.15
reason = "quiet_hours"

# =============================================================================
# 语义记忆
# default memory 的检索阈值在 plugins/default_memory/config.local.toml。
# =============================================================================

[memory]
enabled = true
# 小满默认启用 Akasha Memory；如需兼容旧引擎可显式填写 default。
engine = "akasha"

[memory.embedding]
model = "qwen3.7-text-embedding"
api_key = "sk-..."
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

# 对话、执行轨迹和主动规则共用一次后台语义分析；一般保持默认即可。
[conversation_semantics]
enabled = true
# 高价值信号会立即分析；普通对话在空闲或累计到 max_turns 时批量分析。
idle_seconds = 480
max_turns = 8
analysis_version = "conversation-v3"

# =============================================================================
# LLM 可观测性（可选）
# Cloud Hobby 可直接使用；密钥只从环境变量读取，不要提交到配置文件。
# =============================================================================

[observability.langfuse]
enabled = false
public_key = "${LANGFUSE_PUBLIC_KEY}"
secret_key = "${LANGFUSE_SECRET_KEY}"
base_url = "${LANGFUSE_BASE_URL}"
environment = "development"
sample_rate = 1.0
flush_at = 15
flush_interval_seconds = 1.0
capture_content = true
max_content_chars = 60000
debug = false

# =============================================================================
# 主动推送（可选）
# 先跑通基本对话再开启这部分。
# =============================================================================

[proactive]
# 开启后 agent 会主动向你推送消息。需要先填好下方 chat_id 再设为 true。
enabled = false
profile = "daily"

[proactive.target]
channel = "telegram"
# 你的 Telegram user id（向 bot 发一条消息后从日志里可以拿到）。
# 官方 QQBot 私聊可填：channel = "qqbot"，chat_id = "c2c:USER_OPENID"
chat_id = ""

[proactive.agent]
max_steps = 12
content_limit = 5
web_fetch_max_chars = 8000
context_prob = 0.03
delivery_cooldown_hours = 1

[proactive.drift]
# Drift：无可推送内容时 agent 自主做任务。建议先跑通 proactive 再开启。
enabled = false
max_steps = 8
min_interval_hours = 3

# =============================================================================
# 其他集成（可选）
# =============================================================================

[integrations.fitbit]
enabled = false

